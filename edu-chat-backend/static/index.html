<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育助手 · 对话Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh;
         display: flex; background: #f0f2f5; color: #1f2329; }
  /* ---------- 侧边栏 ---------- */
  #sidebar { width: 230px; background: #23272e; color: #d7dce3; display: flex;
             flex-direction: column; flex-shrink: 0; }
  #sidebar h1 { font-size: 15px; padding: 18px 16px 12px; color: #fff;
                border-bottom: 1px solid #3a4049; }
  #new-chat { margin: 12px; padding: 9px 0; background: #3b82f6; color: #fff;
              border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
  #new-chat:hover { background: #2f6fe0; }
  #sessions { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .session { padding: 10px 10px; margin-bottom: 4px; border-radius: 8px; font-size: 13px;
             cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             display: flex; align-items: center; justify-content: space-between; }
  .session:hover { background: #333944; }
  .session.active { background: #3b82f6; color: #fff; }
  .session .del { visibility: hidden; color: #ff8080; font-weight: bold; padding: 0 4px; }
  .session:hover .del { visibility: visible; }
  /* ---------- 聊天区 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-area { flex: 1; overflow-y: auto; padding: 24px 6%; display: flex;
               flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; animation: fadeUp .25s ease; }
  .row.user { justify-content: flex-end; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; } }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .row.assistant .avatar { background: #dbeafe; }
  .row.user .avatar { background: #dcfce7; order: 2; }
  .col { max-width: 78%; min-width: 0; }
  .bubble { padding: 11px 15px; border-radius: 12px; font-size: 14px; line-height: 1.7;
            word-break: break-word; }
  .row.user .bubble { background: #95ec69; border-top-right-radius: 3px;
                      white-space: pre-wrap; }
  .row.assistant .bubble { background: #fff; border-top-left-radius: 3px;
                           box-shadow: 0 1px 3px rgba(0,0,0,.09); }
  .meta { font-size: 11px; color: #98a2b3; margin-top: 5px; padding-left: 2px; }
  .meta:empty { display: none; }
  .meta b { color: #3b82f6; font-weight: 600; }
  /* ---------- AI 回复内的 Markdown 排版 ---------- */
  .row.assistant .bubble > :last-child { margin-bottom: 0; }
  .bubble h3, .bubble h4 { font-size: 14.5px; margin: 12px 0 6px; color: #0f172a;
                           border-left: 3px solid #3b82f6; padding-left: 8px;
                           line-height: 1.45; }
  .bubble h3:first-child, .bubble h4:first-child { margin-top: 2px; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { color: #0f172a; }
  .bubble code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
                 font-size: 12.5px; font-family: Consolas, monospace; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px;
                  display: block; overflow-x: auto; max-width: 100%; }
  .bubble th, .bubble td { border: 1px solid #e2e8f0; padding: 5px 10px; text-align: left; }
  .bubble th { background: #f1f5f9; color: #334155; white-space: nowrap; }
  .bubble hr { border: none; border-top: 1px solid #e2e8f0; margin: 10px 0; }
  .thinking span { display: inline-block; width: 6px; height: 6px; margin-right: 4px;
                   background: #b9c1cf; border-radius: 50%; animation: blink 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  /* ---------- 输入区 ---------- */
  #input-bar { display: flex; gap: 10px; padding: 14px 6% 20px; background: #f0f2f5; }
  #query { flex: 1; padding: 11px 14px; border: 1px solid #d5dae2; border-radius: 10px;
           font-size: 14px; outline: none; resize: none; font-family: inherit; }
  #query:focus { border-color: #3b82f6; }
  #send { padding: 0 22px; background: #3b82f6; color: #fff; border: none;
          border-radius: 10px; font-size: 14px; cursor: pointer; }
  #send:disabled { background: #a8c3f0; cursor: not-allowed; }
  #empty { margin: auto; text-align: center; color: #98a2b3; font-size: 14px; line-height: 2.2; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>📚 教育助手</h1>
    <button id="new-chat">＋ 新建会话</button>
    <div id="sessions"></div>
  </div>
  <div id="main">
    <div id="chat-area"><div id="empty">你好！我是你的学习助手 🤖<br>
      可以让我：<b>讲题思路</b> / 分析错题 / 制定学习计划 / 查升学政策 / 聊聊压力<br>
      试试：「帮我解一道高二数学题」</div></div>
    <div id="input-bar">
      <textarea id="query" rows="1" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

/* ---------- 轻量 Markdown 渲染（零依赖：标题/加粗/列表/表格/代码/分隔线/LaTeX定界符） ---------- */
function esc(t) { return (t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/\\\[([^\\]*)\\\]/g, "$1")   // 去掉 LaTeX 定界符 \[ \]
    .replace(/\\\(([^\\]*)\\\)/g, "$1");  // 去掉 \( \)
}
function mdToHtml(src) {
  const lines = (src || "").split(/\r?\n/);
  const out = []; let list = null, table = [];
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const body = table.filter(r => !r.includes("---"));   // 丢弃 |---|---| 分隔行
    const cells = body.map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    if (cells.length) {
      let h = "<table><thead><tr>" +
        cells[0].map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      for (let i = 1; i < cells.length; i++)
        h += "<tr>" + cells[i].map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out.push(h + "</tbody></table>");
    }
    table = [];
  };
  for (const raw of lines) {
    const t = raw.trim();
    if (t.startsWith("|")) { closeList(); table.push(t); continue; }
    flushTable();
    if (!t) { closeList(); continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)/))) { closeList(); out.push(`<h3>${inline(m[2])}</h3>`); }
    else if (/^(-{3,}|\*{3,})$/.test(t))  { closeList(); out.push("<hr>"); }
    else if ((m = t.match(/^[-*•]\s+(.*)/))) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(m[1])}</li>`);
    }
    else if ((m = t.match(/^\d+[.、)]\s+(.*)/))) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(m[1])}</li>`);
    }
    else { closeList(); out.push(`<p>${inline(t)}</p>`); }
  }
  closeList(); flushTable();
  return out.join("");
}

/* ---------- 会话存储（前端：会话列表+展示历史，localStorage） ---------- */
const store = {
  load()  { return JSON.parse(localStorage.getItem("edu_sessions") || "{}"); },
  save(d) { localStorage.setItem("edu_sessions", JSON.stringify(d)); },
};
let sessions = store.load();
let curSid = null;

function renderSessions() {
  const box = $("sessions"); box.innerHTML = "";
  Object.entries(sessions).forEach(([sid, s]) => {
    const div = document.createElement("div");
    div.className = "session" + (sid === curSid ? " active" : "");
    div.innerHTML = `<span class="title">${esc(s.title || "新会话")}</span>
                     <span class="del" title="删除">✕</span>`;
    div.querySelector(".title").onclick = () => switchSession(sid);
    div.querySelector(".del").onclick = e => { e.stopPropagation(); deleteSession(sid); };
    box.appendChild(div);
  });
}
async function newSession() {
  const r = await fetch("/api/sessions", { method: "POST" });
  const { session_id } = await r.json();
  sessions[session_id] = { title: "新会话", messages: [] };
  store.save(sessions); switchSession(session_id);
}
function switchSession(sid) { curSid = sid; renderSessions(); renderMessages(); }
function deleteSession(sid) {
  delete sessions[sid]; store.save(sessions);
  if (curSid === sid) { const ks = Object.keys(sessions); curSid = ks[0] || null; }
  renderSessions(); renderMessages();
}

/* ---------- 消息渲染 ---------- */
function renderMessages() {
  const area = $("chat-area"); area.innerHTML = "";
  const s = sessions[curSid];
  if (!s || !s.messages.length) {
    area.innerHTML = `<div id="empty">你好！我是你的学习助手 🤖<br>
      试试：「帮我解一道高二数学题」</div>`; return;
  }
  s.messages.forEach(m => addBubble(m.role, m.content, m.meta, false));
  area.scrollTop = area.scrollHeight;
}
function addBubble(role, content, meta, scroll = true) {
  $("empty")?.remove();
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "assistant");
  const avatar = role === "user" ? "🧑" : "🤖";
  const body = role === "user" ? esc(content) : mdToHtml(content);
  // .meta 元素始终存在（流式路径会动态填充），无内容时 CSS 隐藏
  row.innerHTML = `<div class="avatar">${avatar}</div>
    <div class="col"><div class="bubble">${body}</div><div class="meta">${meta || ""}</div></div>`;
  $("chat-area").appendChild(row);
  if (scroll) $("chat-area").scrollTop = $("chat-area").scrollHeight;
  return row;
}
function addThinking() {
  const row = addBubble("assistant", "");
  row.querySelector(".bubble").innerHTML =
    '<span class="thinking"><span></span><span></span><span></span></span> ' +
    '意图识别 → 路由 → Agent 生成中…';
  return row;
}

/* ---------- 发送（优先SSE流式，失败自动回退JSON整包） ---------- */
function renderStream(bubble, acc) {
  bubble.innerHTML = mdToHtml(acc);
  $("chat-area").scrollTop = $("chat-area").scrollHeight;
}
function metaText(m, secs) {
  return `<b>${m.intent.primary_intent_zh}</b> · ${m.route_kind}` +
    (Object.keys(m.slots).length
      ? ` · 槽位:${Object.entries(m.slots).map(([k, v]) => k + "=" + v).join(" ")}` : "") +
    (secs != null ? ` · ${secs}s` : "");
}

async function send() {
  const text = $("query").value.trim();
  if (!text || !curSid || $("send").disabled) return;
  $("query").value = ""; $("send").disabled = true;
  const s = sessions[curSid];
  if (s.title === "新会话") { s.title = text.slice(0, 14); renderSessions(); }
  s.messages.push({ role: "user", content: text });
  addBubble("user", text);
  const t0 = performance.now();
  const tRow = addThinking();          // 发送即显示思考动画（流式meta到达前不空屏）
  let ok = false;
  try     { ok = await sendStream(s, text, tRow, t0); }  // SSE 打字机
  catch (e) { console.warn("stream failed:", e); }
  if (!ok) {                                             // 整包回退
    try     { ok = await sendJson(s, text, tRow, t0); }
    catch (e) { tRow.remove(); addBubble("assistant", "网络异常，请稍后重试 " + e); }
  }
  store.save(sessions); $("send").disabled = false; $("query").focus();
}

async function sendStream(s, text, tRow, t0) {
  const resp = await fetch("/api/chat/stream", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: curSid, query: text }),
  });
  if (!resp.ok || !resp.body) return false;
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "", acc = "", row = null, bubble = null, metaEl = null,
      meta = null, doneEv = null, gotAny = false;
  const ensureRow = () => {          // 首个事件到达：思考动画升级为正式气泡
    if (row) return;
    tRow.remove();
    row = addBubble("assistant", "", " ");
    bubble = row.querySelector(".bubble");
    metaEl = row.querySelector(".meta");
    metaEl.innerHTML = "识别中…";
  };
  const finalize = () => {
    if (!row) { tRow.remove(); return; }
    if (!acc && doneEv && doneEv.reply) { acc = doneEv.reply; renderStream(bubble, acc); }
    if (metaEl && meta) metaEl.innerHTML = metaText(meta, (performance.now() - t0) / 1000);
    s.messages.push({ role: "assistant", content: acc, meta: metaEl ? metaEl.innerHTML : "" });
  };
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = frame.split("\n").find(l => l.startsWith("data:"));
      if (!line) continue;
      const payload = line.slice(5).trim();
      if (payload === "[DONE]") continue;
      let ev; try { ev = JSON.parse(payload); } catch { continue; }
      gotAny = true;
      if (ev.type === "meta") {          // 意图/路由/槽位 先行到达
        meta = ev;
        ensureRow();
        metaEl.innerHTML = metaText(meta, null) + " · ⏳ 生成中…";
      } else if (ev.type === "delta") {  // 答案逐块打出
        ensureRow();
        acc += ev.text;
        renderStream(bubble, acc);
      } else if (ev.type === "replace") {// 守卫整段替换
        ensureRow();
        acc = ev.text;
        renderStream(bubble, acc);
      } else if (ev.type === "done") {
        doneEv = ev;
      } else if (ev.type === "error") {
        throw new Error(ev.message);
      }
    }
  }
  if (!gotAny) return false;   // 端点异常无事件 → 回退JSON
  finalize();
  return true;
}

async function sendJson(s, text, tRow, t0) {
  const r = await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: curSid, query: text }),
  });
  const d = await r.json();
  tRow.remove();
  const meta = `<b>${d.intent.primary_intent_zh || d.intent.primary_intent}</b>` +
    ` · ${d.route_kind}` +
    (Object.keys(d.slots).length ? ` · 槽位:${Object.entries(d.slots).map(([k, v]) => k + "=" + v).join(" ")}` : "") +
    ` · ${Math.round(performance.now() - t0) / 1000}s`;
  addBubble("assistant", d.reply, meta);
  s.messages.push({ role: "assistant", content: d.reply, meta });
  return true;
}

$("send").onclick = send;
$("new-chat").onclick = newSession;
$("query").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

(async function init() {
  const ks = Object.keys(sessions);
  if (ks.length) switchSession(ks[0]); else await newSession();
})();
</script>
</body>
</html>
