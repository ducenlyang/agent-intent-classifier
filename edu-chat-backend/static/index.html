<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育助手 · 对话Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh;
         display: flex; background: #f0f2f5; color: #1f2329; }
  /* ---------- 侧边栏 ---------- */
  #sidebar { width: 230px; background: #23272e; color: #d7dce3; display: flex;
             flex-direction: column; flex-shrink: 0; }
  #sidebar h1 { font-size: 15px; padding: 18px 16px 12px; color: #fff;
                border-bottom: 1px solid #3a4049; }
  #new-chat { margin: 12px; padding: 9px 0; background: #3b82f6; color: #fff;
              border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
  #new-chat:hover { background: #2f6fe0; }
  #sessions { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .session { padding: 10px 10px; margin-bottom: 4px; border-radius: 8px; font-size: 13px;
             cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             display: flex; align-items: center; justify-content: space-between; }
  .session:hover { background: #333944; }
  .session.active { background: #3b82f6; color: #fff; }
  .session .del { visibility: hidden; color: #ff8080; font-weight: bold; padding: 0 4px; }
  .session:hover .del { visibility: visible; }
  /* ---------- 聊天区 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-area { flex: 1; overflow-y: auto; padding: 24px 8%; display: flex;
               flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; }
  .row.user { justify-content: flex-end; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .row.assistant .avatar { background: #dbeafe; }
  .row.user .avatar { background: #dcfce7; order: 2; }
  .bubble { max-width: 72%; padding: 10px 14px; border-radius: 12px; font-size: 14px;
            line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .row.user .bubble { background: #95ec69; border-top-right-radius: 3px; }
  .row.assistant .bubble { background: #fff; border-top-left-radius: 3px;
                           box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .meta { font-size: 11px; color: #98a2b3; margin-top: 4px; }
  .meta b { color: #3b82f6; font-weight: 600; }
  .thinking span { display: inline-block; width: 6px; height: 6px; margin-right: 4px;
                   background: #b9c1cf; border-radius: 50%; animation: blink 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  /* ---------- 输入区 ---------- */
  #input-bar { display: flex; gap: 10px; padding: 14px 8% 20px; background: #f0f2f5; }
  #query { flex: 1; padding: 11px 14px; border: 1px solid #d5dae2; border-radius: 10px;
           font-size: 14px; outline: none; resize: none; font-family: inherit; }
  #query:focus { border-color: #3b82f6; }
  #send { padding: 0 22px; background: #3b82f6; color: #fff; border: none;
          border-radius: 10px; font-size: 14px; cursor: pointer; }
  #send:disabled { background: #a8c3f0; cursor: not-allowed; }
  #empty { margin: auto; text-align: center; color: #98a2b3; font-size: 14px; line-height: 2.2; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>📚 教育助手</h1>
    <button id="new-chat">＋ 新建会话</button>
    <div id="sessions"></div>
  </div>
  <div id="main">
    <div id="chat-area"><div id="empty">你好！我是你的学习助手 🤖<br>
      可以让我：<b>讲题思路</b> / 分析错题 / 制定学习计划 / 查升学政策 / 聊聊压力<br>
      试试：「帮我解一道高二数学题」</div></div>
    <div id="input-bar">
      <textarea id="query" rows="1" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const store = {
  load()  { return JSON.parse(localStorage.getItem("edu_sessions") || "{}"); },
  save(d) { localStorage.setItem("edu_sessions", JSON.stringify(d)); },
};
let sessions = store.load();     // {sid: {title, messages:[{role, content, meta}]}}
let curSid = null;

/* ---------- 会话侧边栏 ---------- */
function renderSessions() {
  const box = $("sessions"); box.innerHTML = "";
  Object.entries(sessions).forEach(([sid, s]) => {
    const div = document.createElement("div");
    div.className = "session" + (sid === curSid ? " active" : "");
    div.innerHTML = `<span class="title">${esc(s.title || "新会话")}</span>
                     <span class="del" title="删除">✕</span>`;
    div.querySelector(".title").onclick = () => switchSession(sid);
    div.querySelector(".del").onclick = e => { e.stopPropagation(); deleteSession(sid); };
    box.appendChild(div);
  });
}
async function newSession() {
  const r = await fetch("/api/sessions", { method: "POST" });
  const { session_id } = await r.json();
  sessions[session_id] = { title: "新会话", messages: [] };
  store.save(sessions); switchSession(session_id);
}
function switchSession(sid) {   // 切换会话：各自记忆隔离
  curSid = sid; renderSessions(); renderMessages();
}
function deleteSession(sid) {
  delete sessions[sid]; store.save(sessions);
  if (curSid === sid) { const ks = Object.keys(sessions); curSid = ks[0] || null; }
  renderSessions(); renderMessages();
}

/* ---------- 消息渲染 ---------- */
function esc(t) { return (t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderMessages() {
  const area = $("chat-area"); area.innerHTML = "";
  const s = sessions[curSid];
  if (!s || !s.messages.length) {
    area.innerHTML = `<div id="empty">你好！我是你的学习助手 🤖<br>
      试试：「帮我解一道高二数学题」</div>`; return;
  }
  s.messages.forEach(m => addBubble(m.role, m.content, m.meta, false));
  area.scrollTop = area.scrollHeight;
}
function addBubble(role, content, meta, scroll = true) {
  $("empty")?.remove();
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "assistant");
  const avatar = role === "user" ? "🧑" : "🤖";
  let metaHtml = "";
  if (meta) metaHtml = `<div class="meta">${meta}</div>`;
  row.innerHTML = `<div class="avatar">${avatar}</div>
    <div><div class="bubble">${esc(content)}</div>${metaHtml}</div>`;
  $("chat-area").appendChild(row);
  if (scroll) $("chat-area").scrollTop = $("chat-area").scrollHeight;
  return row;
}
function addThinking() {
  const row = addBubble("assistant", "");
  row.querySelector(".bubble").innerHTML =
    '<span class="thinking"><span></span><span></span><span></span></span> ' +
    '意图识别 → 路由 → Agent 生成中…';
  return row;
}

/* ---------- 发送 ---------- */
async function send() {
  const text = $("query").value.trim();
  if (!text || !curSid || $("send").disabled) return;
  $("query").value = ""; $("send").disabled = true;
  const s = sessions[curSid];
  if (s.title === "新会话") { s.title = text.slice(0, 14); renderSessions(); }
  s.messages.push({ role: "user", content: text });
  addBubble("user", text);
  const tRow = addThinking();
  const t0 = performance.now();
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: curSid, query: text }),
    });
    const d = await r.json();
    tRow.remove();
    const meta = `<b>${d.intent.primary_intent_zh || d.intent.primary_intent}</b>` +
      ` · ${d.route_kind}` +
      (Object.keys(d.slots).length ? ` · 槽位:${Object.entries(d.slots).map(([k,v])=>k+"="+v).join(" ")}` : "") +
      ` · ${Math.round(performance.now() - t0) / 1000}s`;
    addBubble("assistant", d.reply, meta);
    s.messages.push({ role: "assistant", content: d.reply, meta });
  } catch (e) {
    tRow.remove();
    addBubble("assistant", "网络异常，请稍后重试 " + e);
  }
  store.save(sessions); $("send").disabled = false; $("query").focus();
}

$("send").onclick = send;
$("new-chat").onclick = newSession;
$("query").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

/* ---------- 初始化 ---------- */
(async function init() {
  const ks = Object.keys(sessions);
  if (ks.length) switchSession(ks[0]); else await newSession();
})();
</script>
</body>
</html>
