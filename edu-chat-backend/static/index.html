<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未至 · 伴学空间</title>
<link rel="stylesheet" href="/katex/katex.min.css">
<style>
  :root {
    /* DeepSeek Harness 设计令牌——浅色(默认): 实测自其CSS设计系统 */
    --bg: #ffffff; --sidebar: #f9fafb; --sidebar-2: #f9fafb; --sidebar-hover: rgba(38, 49, 72, .06);
    --surface-2: #f1f3f5;            /* 输入卡/用户气泡 */
    --btn-secondary: #ffffff;        /* 新建会话按钮 */
    --btn-secondary-border: rgba(38, 49, 72, .1);
    --accent: #4176e6; --accent-hover: #5686fe; --accent-soft: #edf3fe;
    --text: #0f1115; --muted: #61666b; --muted-dim: #adb2b8;
    --border: rgba(38, 49, 72, .08); --border-strong: rgba(38, 49, 72, .14);
    --user-bubble: #f1f3f5; --code-bg: rgba(38, 49, 72, .06);
    --scroll: rgba(38, 49, 72, .22); --th-bg: rgba(38, 49, 72, .04);
    --send-disabled: rgba(38, 49, 72, .12); --card-shadow: 0 2px 12px rgba(38, 49, 72, .08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
         display: flex; background: var(--bg); color: var(--text); font-size: 16px; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- 侧边栏（DeepSeek式浅灰） ---------- */
  #sidebar { width: 280px; background: var(--sidebar-2); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 7px; padding: 18px 12px 12px; }
  .brand-logo { width: 26px; height: 26px; color: var(--text); flex-shrink: 0; }
  .brand-name { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
  .brand-badge { font-size: 10px; font-weight: 600; letter-spacing: .8px;
                 border: 1px solid var(--border-strong); color: var(--muted);
                 border-radius: 5px; padding: 1px 5px; margin-left: 2px; }
  #new-chat { margin: 8px 4px 12px; padding: 8px 16px; background: var(--btn-secondary);
              color: var(--text); border: 1px solid var(--btn-secondary-border); border-radius: 12px;
              font-size: 14px; display: flex; align-items: center; justify-content: center;
              gap: 6px; min-height: 38px; transition: background .15s; }
  #new-chat:hover { background: var(--sidebar-hover); }
  #new-chat svg { color: var(--accent); }
  .side-label { font-size: 13px; color: var(--text); padding: 6px 12px 6px;
                display: flex; align-items: center; }
  #sessions { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 10px 10px; }
  .session { display: flex; align-items: center; gap: 8px; padding: 0 8px; margin-bottom: 1px;
             height: 34px; border-radius: 8px; font-size: 14px; color: var(--muted); cursor: pointer;
             white-space: nowrap; overflow: hidden; transition: background .12s; }
  .session:hover { background: var(--sidebar-hover); }
  .session.active { background: var(--accent-soft); color: var(--text); }
  .session.active svg { color: var(--accent); }
  .session svg { flex-shrink: 0; color: var(--muted); }
  .session .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .session .del { visibility: hidden; border: none; background: none; color: #b0b0b0;
                  display: flex; padding: 2px; border-radius: 4px; flex-shrink: 0; }
  .session:hover .del { visibility: visible; }
  .session .del:hover { color: #ef4444; background: rgba(239, 68, 68, .1); }

  /* ---------- 主区（居中对话列 + 右侧轨迹面板） ---------- */
  #main { flex: 1; display: flex; min-width: 0; min-height: 0; position: relative; }
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #chat-area { flex: 1 1 0; min-height: 0; overflow-y: auto; }
  .thread { max-width: 760px; margin: 0 auto; padding: 28px 24px 16px;
            display: flex; flex-direction: column; gap: 22px; }
  #chat-area::-webkit-scrollbar, #sessions::-webkit-scrollbar { width: 8px; }
  #chat-area::-webkit-scrollbar-thumb, #sessions::-webkit-scrollbar-thumb {
    background: var(--scroll); border-radius: 4px; }
  #sessions::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; opacity: .7; }

  /* 用户消息：右侧灰色气泡，无头像 */
  .row.user { display: flex; justify-content: flex-end; animation: fadeUp .22s ease; }
  .row.user .col { max-width: 75%; min-width: 0; }
  .row.user .bubble { background: var(--user-bubble); white-space: pre-wrap;
                      border-radius: 18px 18px 4px 18px; padding: 11px 16px;
                      line-height: 1.65; word-break: break-word; }

  /* AI回复：小logo + 纯文本无气泡（DeepSeek式） */
  .row.assistant { animation: fadeUp .22s ease; }
  .row.assistant .col { min-width: 0; }
  .row.assistant .bubble { line-height: 1.75; word-break: break-word; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .meta { font-size: 12px; color: var(--muted); margin-top: 8px;
          display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .meta:empty { display: none; }
  .meta b { color: var(--accent); font-weight: 600; }
  .meta .tag { background: var(--accent-soft); color: var(--accent); border-radius: 4px;
               padding: 1px 6px; font-size: 11px; font-weight: 500; }

  /* ---------- Markdown 排版 ---------- */
  .row.assistant .bubble > :last-child { margin-bottom: 0; }
  .bubble h3, .bubble h4 { font-size: 15.5px; margin: 14px 0 8px; font-weight: 600; }
  .bubble p { margin: 8px 0; }
  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; }
  .bubble li { margin: 4px 0; }
  .bubble strong { font-weight: 600; }
  .bubble code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px;
                 font-size: 13px; font-family: Consolas, monospace; }
  .bubble table { border-collapse: collapse; margin: 10px 0; font-size: 13.5px;
                  display: block; overflow-x: auto; max-width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  .bubble th { background: var(--th-bg); font-weight: 600; white-space: nowrap; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .bubble .math { font-family: Cambria Math, "Times New Roman", Georgia, serif;
                  background: var(--code-bg); border-radius: 6px; padding: 1px 7px;
                  margin: 0 2px; white-space: nowrap; }
  .bubble p:has(> .math:only-child) { text-align: center; margin: 10px 0; }
  .bubble p:has(> .math:only-child) .math { display: inline-block; padding: 6px 14px; }
  .bubble .katex-display { margin: 12px 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

  .thinking span { display: inline-block; width: 6px; height: 6px; margin-right: 4px;
                   background: #b8b8b8; border-radius: 50%; animation: blink 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- 空状态 ---------- */
  #empty { min-height: 100%; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
  .empty-head { display: flex; align-items: center; justify-content: center;
                gap: 12px; margin-bottom: 14px; }
  .empty-logo { width: 40px; height: 40px; color: var(--text); }
  #empty h2 { font-size: 30px; font-weight: 600; letter-spacing: -.5px; }
  #empty .brand-badge { font-size: 11px; align-self: flex-start; margin-top: 6px; }
  #empty p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  #empty .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { background: transparent; border: 1px solid var(--border-strong); color: var(--muted);
          border-radius: 999px; padding: 9px 16px; font-size: 13px;
          transition: border-color .15s, color .15s; min-height: 38px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- 输入区（底部居中胶囊） ---------- */
  #input-bar { padding: 8px 24px 18px; background: linear-gradient(transparent, var(--bg) 40%); }
  .input-card { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column;
                gap: 12px; background: var(--surface-2); border: 1px solid var(--border);
                border-radius: 22px; padding: 10px 0 0;
                box-shadow: rgba(0,0,0,.02) 0 4px 12px, rgba(0,0,0,.04) 0 2px 8px;
                transition: border-color .15s, box-shadow .15s; }
  .input-row { display: flex; align-items: flex-end; gap: 10px; }
  .input-card:focus-within { border-color: var(--accent);
                             box-shadow: 0 2px 16px var(--accent-soft), var(--card-shadow); }
  #query { flex: 1; border: none; outline: none; resize: none; font-size: 16px;
           font-family: inherit; line-height: 22px; max-height: 140px;
           background: transparent; color: var(--text); padding: 4px 12px 0 16px; }
  #query::placeholder { color: #ababab; }
  .tool-ico { display: flex; align-items: center; justify-content: center;
              width: 28px; height: 28px; border-radius: 6px; color: var(--muted);
              margin: 0 0 8px 12px; }
  .tool-model { margin: 0 12px 12px auto; font-size: 13px; color: var(--text);
                font-weight: 600; align-self: flex-end; }
  .tool-model i { font-style: normal; font-weight: 400; color: var(--muted-dim);
                  margin-left: 3px; font-size: 12px; }
  #send { width: 34px; height: 34px; border: none; border-radius: 999px; flex-shrink: 0;
          margin: 0 10px 10px auto; background: var(--accent); color: #fff;
          display: flex; align-items: center; justify-content: center;
          transition: background .2s, opacity .2s; }
  #send:hover { background: var(--accent-hover); }
  #send:disabled { background: var(--send-disabled); cursor: not-allowed; }

  /* ---------- 右侧对话轨迹面板（可收起/展开） ---------- */
  #trace-panel { width: 296px; flex-shrink: 0; border-left: 1px solid var(--border);
                background: var(--sidebar); display: flex; flex-direction: column;
                min-height: 0; }
  #trace-panel.hidden { display: none; }
  #trace-panel h3 { font-size: 13px; padding: 14px 8px 12px 16px; color: var(--muted);
                    font-weight: 600; border-bottom: 1px solid var(--border);
                    display: flex; align-items: center; justify-content: space-between; }
  #trace-close { border: none; background: none; color: var(--muted); cursor: pointer;
                 display: flex; padding: 5px; border-radius: 6px; }
  #trace-close:hover { background: var(--sidebar-hover); color: var(--text); }
  #trace-open { position: absolute; right: 0; top: 14px; width: 26px; height: 44px;
                border: 1px solid var(--border); border-right: none;
                border-radius: 10px 0 0 10px; background: var(--surface-2);
                color: var(--muted); cursor: pointer; display: none;
                align-items: center; justify-content: center;
                box-shadow: -2px 2px 8px rgba(0,0,0,.06); z-index: 5; }
  #trace-open:hover { color: var(--accent); }
  body.trace-hidden #trace-open { display: flex; }
  #trace-body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 14px 16px;
                font-size: 12.5px; }
  .tp-section { margin-bottom: 16px; }
  .tp-label { font-size: 11px; color: var(--muted-dim); letter-spacing: 1px;
              margin-bottom: 5px; }
  .tp-value { color: var(--text); line-height: 1.65; }
  .tp-dim { color: var(--muted); }
  .tp-chip { display: inline-block; background: var(--accent-soft); color: var(--accent);
             border-radius: 4px; padding: 1px 7px; margin: 1px 3px 1px 0; font-size: 11px; }
  .tp-chip.warn { background: rgba(239, 152, 68, .15); color: #ef9a48; }
  .tp-chip.act { background: rgba(34, 197, 94, .14); color: #16a34a; }
  .tp-chip.act.plain { background: var(--accent-soft); color: var(--accent); }
  .tp-steps { list-style: none; margin-left: 7px; border-left: 2px solid var(--border); }
  .tp-steps li { position: relative; padding: 5px 0 5px 16px; color: var(--muted);
                 line-height: 1.55; }
  .tp-steps li::before { content: attr(data-i); position: absolute; left: -9px; top: 7px;
                         width: 16px; height: 16px; border-radius: 50%;
                         background: var(--surface-2); color: var(--muted);
                         font-size: 9px; display: flex; align-items: center;
                         justify-content: center; }
  .tp-empty { color: var(--muted-dim); line-height: 1.7; }
  .tp-msgs { border-left: 2px solid var(--border); margin-left: 7px; padding-left: 10px; }
  .tp-msg { display: flex; gap: 7px; padding: 4px 0; line-height: 1.55; }
  .tp-role { flex-shrink: 0; font-size: 11px; border-radius: 4px; padding: 0 6px;
             height: 18px; display: inline-flex; align-items: center; }
  .tp-role.u { background: rgba(239, 152, 68, .15); color: #ef9a48; }
  .tp-role.a { background: var(--accent-soft); color: var(--accent); }
  .tp-text { color: var(--muted); word-break: break-all; display: -webkit-box;
             -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .tp-role.s { background: var(--accent-soft); color: var(--muted); }
  .tp-llm { border: 1px solid var(--border); border-radius: 6px; margin: 4px 0; }
  .tp-llm summary { padding: 5px 8px; cursor: pointer; color: var(--text);
                    font-size: 11.5px; user-select: none; }
  .tp-llm[open] summary { border-bottom: 1px solid var(--border); }
  .tp-llm summary:hover { background: var(--surface-2); }
  .tp-llm > *:not(summary) { margin: 0 8px 6px; }
  .tp-text-full { color: var(--muted); word-break: break-all; flex: 1; }
  .tp-full { color: var(--muted); white-space: pre-wrap; word-break: break-all;
             line-height: 1.55; max-height: 260px; overflow-y: auto; }

  @media (max-width: 1080px) { #trace-panel { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 8.2c-.9 1.9-2.4 3.1-4.3 3.7.1.5.2 1 .2 1.5 0 3.7-3.5 6.6-8.2 6.6-3.3 0-6.2-1.5-7.6-3.8 2 1.1 4.3 1.2 6 .2 2.6-1.3 3.5-4.1 2.1-6.5-.9-1.6-2.7-2.4-4.5-2.2C7 4.9 10 3.4 13.4 3.8c1-1.1 2.4-1.8 4.1-1.8-.6.6-1 1.4-1.2 2.2 1.1 0 2.1.4 2.9 1 .9.7 1.7 1.6 2.4 3z"/></svg>

<script src="/katex/katex.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const THREAD = () => $("thread");   // 消息统一挂载到居中列

/* ---------- 轻量 Markdown + LaTeX 渲染（零依赖，离线可用） ---------- */
function esc(t) { return (t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* LaTeX → Unicode：覆盖教育场景常用符号/上下标/分数/根号 */
const LATEX_SYMBOLS = {
  "\\times": "×", "\\div": "÷", "\\pm": "±", "\\mp": "∓", "\\cdot": "·",
  "\\le": "≤", "\\leq": "≤", "\\ge": "≥", "\\geq": "≥", "\\neq": "≠", "\\ne": "≠",
  "\\approx": "≈", "\\equiv": "≡", "\\infty": "∞", "\\pi": "π", "\\alpha": "α",
  "\\beta": "β", "\\gamma": "γ", "\\theta": "θ", "\\lambda": "λ", "\\mu": "μ",
  "\\sum": "∑", "\\int": "∫", "\\prod": "∏", "\\sqrt": "√",
  "\\rightarrow": "→", "\\to": "→", "\\Rightarrow": "⇒", "\\mapsto": "↦",
  "\\cdots": "⋯", "\\ldots": "…", "\\dots": "…",
  "\\in": "∈", "\\notin": "∉", "\\subset": "⊂", "\\cup": "∪", "\\cap": "∩",
  "\\degree": "°", "\\circ": "°",
  "\\left": "", "\\right": "", "\\quad": "  ", "\\qquad": "    ",
  "\\;": " ", "\\,": " ", "\\ ": " ",
};
const SUP_MAP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻","+":"⁺","n":"ⁿ","(":"⁽",")":"⁾","a":"ᵃ","b":"ᵇ","x":"ˣ"};
const SUB_MAP = {"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","-":"₋","+":"₊","n":"ₙ","a":"ₐ","x":"ₓ"};
const toSup = t => [...t].map(c => SUP_MAP[c] ?? c).join("");
const toSub = t => [...t].map(c => SUB_MAP[c] ?? c).join("");

function latexToText(s) {
  s = s.replace(/\\begin\{(?:bmatrix|pmatrix|vmatrix|Bmatrix|matrix|cases|aligned|array|gathered)\}/g, "")
       .replace(/\\end\{(?:bmatrix|pmatrix|vmatrix|Bmatrix|matrix|cases|aligned|array|gathered)\}/g, "")
       .replace(/\\begin\{[a-zA-Z*]+\}/g, "").replace(/\\end\{[a-zA-Z*]+\}/g, "")
       .replace(/&/g, "  ").replace(/\\\\/g, "; ")          // 矩阵列分隔/换行
       .replace(/\\text\{([^{}]*)\}/g, "$1")            // \text{或} → 或
       .replace(/\\d?frac\{([^{}]+)\}\{([^{}]+)\}/g, "($1)/($2)")  // \frac{a}{b}
       .replace(/\\sqrt\{([^{}]+)\}/g, "√($1)");         // \sqrt{x}
  const keys = Object.keys(LATEX_SYMBOLS).sort((a, b) => b.length - a.length);
  for (const k of keys) s = s.split(k).join(LATEX_SYMBOLS[k]);
  return s.replace(/\^\{([^{}]+)\}|\^(\w)/g, (m, a, b) => toSup(a ?? b))
          .replace(/_\{([^{}]+)\}|_(\w)/g, (m, a, b) => toSub(a ?? b));
}

function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/\^\{([^{}]+)\}|\^(\w)/g, (m, a, b) => toSup(a ?? b))   // 裸文本上标 x^2
    .replace(/_\{([^{}]+)\}|_(\w)/g, (m, a, b) => toSub(a ?? b));    // 裸文本下标 a_1
}

function mdToHtml(src) {
  // 第一步：先抽取公式，替换为占位符，避免被逐行处理拆散。
  // KaTeX 可用 → 真渲染(矩阵/对齐/cases全覆盖)；不可用 → Unicode 转换兜底
  const maths = [];
  const PH = i => `\u0000M${i}\u0000`;
  const render = (raw, displayMode) => {
    const tex = raw.trim();
    if (window.katex && window.katex.renderToString) {
      try {
        return window.katex.renderToString(tex, { displayMode, throwOnError: false });
      } catch (e) { /* 落入兜底 */ }
    }
    return `<span class="math">${latexToText(esc(tex))}</span>`;
  };
  let s = src || "";
  s = s.replace(/\\\[([\s\S]*?)\\\]/g, (_, m) => (maths.push(render(m, true)),  PH(maths.length - 1)));
  s = s.replace(/\$\$([\s\S]*?)\$\$/g,       (_, m) => (maths.push(render(m, true)),  PH(maths.length - 1)));
  s = s.replace(/\\\(([\s\S]*?)\\\)/g, (_, m) => (maths.push(render(m, false)), PH(maths.length - 1)));
  s = s.replace(/\$([^$\n]{1,120}?)\$/g, (whole, m) =>
    /[\u4e00-\u9fff]/.test(m) ? whole  // 含中文按普通文本(防金额误判)
      : (maths.push(render(m, false)), PH(maths.length - 1)));
  s = s.replace(/\\[\\()\]]/g, "");   // 清理残留的孤立定界符

  // 第二步：逐行 Markdown 处理（占位符原样保留）
  const lines = s.split(/\r?\n/);
  const out = []; let list = null, table = [];
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const body = table.filter(r => !r.includes("---"));   // 丢弃 |---|---| 分隔行
    const cells = body.map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    if (cells.length) {
      let h = "<table><thead><tr>" +
        cells[0].map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      for (let i = 1; i < cells.length; i++)
        h += "<tr>" + cells[i].map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out.push(h + "</tbody></table>");
    }
    table = [];
  };
  for (const raw of lines) {
    const t = raw.trim();
    if (t.startsWith("|")) { closeList(); table.push(t); continue; }
    flushTable();
    if (!t) { closeList(); continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)/))) { closeList(); out.push(`<h3>${inline(m[2])}</h3>`); }
    else if (/^(-{3,}|\*{3,})$/.test(t))  { closeList(); out.push("<hr>"); }
    else if ((m = t.match(/^[-*•]\s+(.*)/))) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(m[1])}</li>`);
    }
    else if ((m = t.match(/^\d+[.、)]\s+(.*)/))) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(m[1])}</li>`);
    }
    else { closeList(); out.push(`<p>${inline(t)}</p>`); }
  }
  closeList(); flushTable();
  // 第三步：恢复公式占位符
  return out.join("").replace(/\u0000M(\d+)\u0000/g, (_, i) => maths[+i]);
}

/* ---------- 会话存储（前端：会话列表+展示历史，localStorage） ---------- */
const store = {
  load()  { return JSON.parse(localStorage.getItem("edu_sessions") || "{}"); },
  save(d) { localStorage.setItem("edu_sessions", JSON.stringify(d)); },
};
let sessions = store.load();
let curSid = null;

const ICON_CHAT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
const ICON_X = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

function renderSessions() {
  const box = $("sessions"); box.innerHTML = "";
  Object.entries(sessions).forEach(([sid, s]) => {
    const div = document.createElement("div");
    div.className = "session" + (sid === curSid ? " active" : "");
    div.innerHTML = `${ICON_CHAT}<span class="title">${esc(s.title || "新会话")}</span>
                     <button class="del" title="删除会话" aria-label="删除会话">${ICON_X}</button>`;
    div.querySelector(".title").onclick = () => switchSession(sid);
    div.querySelector(".del").onclick = e => { e.stopPropagation(); deleteSession(sid); };
    box.appendChild(div);
  });
}
async function newSession() {
  const r = await fetch("/api/sessions", { method: "POST" });
  const { session_id } = await r.json();
  sessions[session_id] = { title: "新会话", messages: [] };
  store.save(sessions); switchSession(session_id);
}
function switchSession(sid) { curSid = sid; renderSessions(); renderMessages(); }
function deleteSession(sid) {
  delete sessions[sid]; store.save(sessions);
  if (curSid === sid) { const ks = Object.keys(sessions); curSid = ks[0] || null; }
  renderSessions(); renderMessages();
}

/* ---------- 空状态 ---------- */
const EMPTY_HTML = `
  <div class="empty-head">
    <svg class="empty-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 8.2c-.9 1.9-2.4 3.1-4.3 3.7.1.5.2 1 .2 1.5 0 3.7-3.5 6.6-8.2 6.6-3.3 0-6.2-1.5-7.6-3.8 2 1.1 4.3 1.2 6 .2 2.6-1.3 3.5-4.1 2.1-6.5-.9-1.6-2.7-2.4-4.5-2.2C7 4.9 10 3.4 13.4 3.8c1-1.1 2.4-1.8 4.1-1.8-.6.6-1 1.4-1.2 2.2 1.1 0 2.1.4 2.9 1 .9.7 1.7 1.6 2.4 3z"/></svg>
    <h2>每一道错题，都值得被讲透</h2>
    <span class="brand-badge">DEMO</span>
  </div>
  <p>从一个疑问开始，我们陪你把它弄懂。</p>
  <div class="chips">
    <button class="chip">帮我解一道高二数学题</button>
    <button class="chip">帮我制定寒假学习计划</button>
    <button class="chip">讲个笑话</button>
  </div>`;
function bindChips() {
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    $("query").value = c.textContent;
    autosize(); $("query").focus();
  });
}

/* ---------- 消息渲染 ---------- */
function renderMessages() {
  const thread = THREAD(); thread.innerHTML = "";
  const s = sessions[curSid];
  if (!s || !s.messages.length) {
    thread.innerHTML = `<div id="empty">${EMPTY_HTML}</div>`; bindChips(); return;
  }
  s.messages.forEach(m => addBubble(m.role, m.content, m.meta, false));
  $("chat-area").scrollTop = $("chat-area").scrollHeight;
}
function addBubble(role, content, meta, scroll = true) {
  $("empty")?.remove();
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "assistant");
  const body = role === "user" ? esc(content) : mdToHtml(content);
  // 用户无头像(右侧灰气泡)；AI左侧小logo+纯文本；.meta始终存在便于流式填充
  row.innerHTML = `<div class="col"><div class="bubble">${body}</div><div class="meta">${meta || ""}</div></div>`;
  THREAD().appendChild(row);
  if (scroll) $("chat-area").scrollTop = $("chat-area").scrollHeight;
  return row;
}
/* ---------- 右侧对话轨迹面板（收起/展开） ---------- */
function setTraceVisible(show) {
  document.getElementById("trace-panel").classList.toggle("hidden", !show);
  document.body.classList.toggle("trace-hidden", !show);
  localStorage.setItem("trace_hidden", show ? "0" : "1");
}
(function initTrace() {
  if (localStorage.getItem("trace_hidden") === "1") setTraceVisible(false);
  document.getElementById("trace-close").onclick = () => setTraceVisible(false);
  document.getElementById("trace-open").onclick = () => setTraceVisible(true);
})();

/* ---------- 右侧对话轨迹面板 ---------- */
const ROUTE_ZH = { risk: "风险拦截", intercept: "风险拦截", clarify: "反问补槽",
                   agent: "Agent生成", error: "异常" };
function selectRow(row) {   // 轨迹面板只随最新消息更新
  renderTracePanel(row ? row._trace : null);
}
function renderTracePanel(t) {
  const body = $("trace-body");
  if (!t) {
    body.innerHTML = '<div class="tp-empty">发送消息后，这里实时显示当前消息的识别与路由轨迹。<br><br>点击任意 AI 回复，可回看那条消息的完整轨迹。</div>';
    return;
  }
  const chips = Object.entries(t.slots || {})
    .map(([k, v]) => `<span class="tp-chip">${k}=${esc(String(v))}</span>`).join("");
  const missing = (t.missing || [])
    .map(f => `<span class="tp-chip warn">缺:${f}</span>`).join("");
  const steps = (t.dt || []).map((x, i) => `<li data-i="${i + 1}">${esc(x)}</li>`).join("");
  const conf = t.intent && t.intent.confidence != null
    ? (t.intent.confidence <= 1 ? (t.intent.confidence * 100).toFixed(1) + "%" : t.intent.confidence)
    : "—";
  const guard = t.guard
    ? (t.guard.passed ? "通过"
       : "拦截：" + esc((t.guard.actions || []).join("；")))
    : "—";
  body.innerHTML = `
    <div class="tp-section"><div class="tp-label">意图</div>
      <div class="tp-value"><b>${esc((t.intent && t.intent.primary_intent_zh) || "?")}</b>
        <span class="tp-dim">${esc((t.intent && t.intent.primary_intent) || "")}</span><br>
        置信度 ${conf}${t.handledBy ? " · " + esc(t.handledBy) : ""}${actBadge(t.act)}</div></div>
    <div class="tp-section"><div class="tp-label">路由</div>
      <div class="tp-value">${ROUTE_ZH[t.route] || esc(t.route || "")}${t.pending ? ' <span class="tp-dim">· 生成中…</span>' : ""}</div></div>
    <div class="tp-section"><div class="tp-label">会话锚点</div>
      <div class="tp-value">${anchorHtml(t.anchor)}</div></div>
    <div class="tp-section"><div class="tp-label">槽位</div>
      <div class="tp-value">${chips || '<span class="tp-dim">无</span>'} ${missing}</div></div>
    <div class="tp-section"><div class="tp-label">守卫</div><div class="tp-value">${guard}</div></div>
    ${t.secs ? `<div class="tp-section"><div class="tp-label">耗时</div><div class="tp-value">${t.secs}s</div></div>` : ""}
    <div class="tp-section"><div class="tp-label">决策轨迹</div>
      <ol class="tp-steps">${steps || '<li data-i="1"><span class="tp-dim">无轨迹数据</span></li>'}</ol></div>
    <div class="tp-section"><div class="tp-label">LLM 调用 (${(t.llm || []).length})</div>
      <div>${llmHtml(t.llm)}</div></div>
    <div class="tp-section"><div class="tp-label">多轮对话 messages (${(t.hist || []).length})</div>
      <div class="tp-msgs">${histHtml(t.hist, t.pending)}</div></div>`;
}
const ACT_ZH = { CONTINUE_CHAT: "继续锚点对话", SLOT_ANSWER: "回答反问",
                 AFFIRM: "承接确认", REFUSE: "拒绝终止", CORRECTED: "矫正意图",
                 NEW_TASK: "新任务", TOPIC_SWITCH: "同意图切主题" };
function actBadge(act) {
  if (!act || !ACT_ZH[act]) return "";
  const cls = act === "CONTINUE_CHAT" ? "" : " plain";
  return `<br>对话行为 <span class="tp-chip act${cls}">${ACT_ZH[act]}</span>`;
}
function anchorHtml(a) {
  if (!a || !a.summary) return '<span class="tp-dim">无（未建立主题）</span>';
  let h = `<span class="tp-chip">${esc(a.summary)}</span>`;
  if (a.question) h += `<div class="tp-dim" style="margin-top:4px">题目: ${esc(String(a.question).slice(0, 80))}${String(a.question).length > 80 ? "…" : ""}</div>`;
  if (a.analysis) h += `<div class="tp-dim" style="margin-top:2px">出题记录: ${esc(a.analysis)}…</div>`;
  return h;
}
function llmHtml(calls) {
  if (!calls || !calls.length)
    return '<span class="tp-dim">本轮未调用 LLM（小模型短路放行）</span>';
  const roleZh = r => r === "user" ? "用户" : r === "assistant" ? "AI" : "SYS";
  const roleCls = r => r === "user" ? "u" : r === "assistant" ? "a" : "s";
  return calls.map((c, i) => `
    <details class="tp-llm">
      <summary>#${i + 1} ${esc(c.purpose || "LLM调用")} · ${((c.latency_ms || 0) / 1000).toFixed(1)}s${c.error ? " · ❌失败" : ""}</summary>
      <div class="tp-label" style="margin-top:6px">输入（${(c.messages || []).length} 条消息）</div>
      ${(c.messages || []).map(m => `
        <div class="tp-msg"><span class="tp-role ${roleCls(m.role)}">${roleZh(m.role)}</span>
          <span class="tp-text-full">${esc(m.content || "")}</span></div>`).join("") ||
        '<span class="tp-dim">（无输入记录）</span>'}
      <div class="tp-label" style="margin-top:6px">输出</div>
      <div class="tp-full">${esc(c.error ? "错误：" + c.error : c.output || "（空）")}</div>
    </details>`).join("");
}
function histHtml(hist, pending) {
  if (!hist || !hist.length) return '<span class="tp-dim">无</span>';
  return hist.map(m =>
    `<div class="tp-msg"><span class="tp-role ${m.role === "user" ? "u" : "a"}">` +
    `${m.role === "user" ? "用户" : "AI"}</span>` +
    `<span class="tp-text">${esc(m.content)}` +
    (pending && m === hist[hist.length - 1] ? ' <span class="tp-dim">⏳</span>' : "") +
    `</span></div>`).join("") +
    (pending ? '<div class="tp-msg"><span class="tp-role a">AI</span><span class="tp-dim">生成中…</span></div>' : "");
}

function addThinking() {
  const row = addBubble("assistant", "");
  row.querySelector(".bubble").innerHTML =
    '<span class="thinking"><span></span><span></span><span></span></span> ' +
    '意图识别 → 路由 → Agent 生成中…';
  return row;
}

/* ---------- 发送（优先SSE流式，失败自动回退JSON整包） ---------- */
function renderStream(bubble, acc) {
  bubble.innerHTML = mdToHtml(acc);
  $("chat-area").scrollTop = $("chat-area").scrollHeight;
}
function metaText(m, secs) {
  return `<b>${m.intent.primary_intent_zh}</b> · ${m.route_kind}` +
    (Object.keys(m.slots).length
      ? ` · 槽位:${Object.entries(m.slots).map(([k, v]) => k + "=" + v).join(" ")}` : "") +
    (secs != null ? ` · ${secs}s` : "");
}

async function send() {
  const text = $("query").value.trim();
  if (!text || !curSid || $("send").disabled) return;
  $("query").value = ""; autosize(); $("send").disabled = true;
  const s = sessions[curSid];
  if (s.title === "新会话") { s.title = text.slice(0, 14); renderSessions(); }
  s.messages.push({ role: "user", content: text });
  addBubble("user", text);
  const t0 = performance.now();
  const tRow = addThinking();          // 发送即显示思考动画（流式meta到达前不空屏）
  let ok = false;
  try     { ok = await sendStream(s, text, tRow, t0); }  // SSE 打字机
  catch (e) { console.warn("stream failed:", e); }
  if (!ok) {                                             // 整包回退
    try     { ok = await sendJson(s, text, tRow, t0); }
    catch (e) { tRow.remove(); addBubble("assistant", "网络异常，请稍后重试 " + e); }
  }
  store.save(sessions); $("send").disabled = false; $("query").focus();
}

async function sendStream(s, text, tRow, t0) {
  const resp = await fetch("/api/chat/stream", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: curSid, query: text }),
  });
  if (!resp.ok || !resp.body) return false;
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "", acc = "", row = null, bubble = null, metaEl = null,
      meta = null, doneEv = null, gotAny = false;
  const ensureRow = () => {          // 首个事件到达：思考动画升级为正式气泡
    if (row) return;
    tRow.remove();
    row = addBubble("assistant", "", " ");
    bubble = row.querySelector(".bubble");
    metaEl = row.querySelector(".meta");
    metaEl.innerHTML = "识别中…";
  };
  const finalize = () => {
    if (!row) { tRow.remove(); return; }
    if (!acc && doneEv && doneEv.reply) { acc = doneEv.reply; renderStream(bubble, acc); }
    if (metaEl && meta) metaEl.innerHTML = metaText(meta, (performance.now() - t0) / 1000);
    const trace = {
      intent: meta && meta.intent, route: meta && meta.route_kind,
      slots: (meta && meta.slots) || {}, missing: (meta && meta.missing_slots) || [],
      dt: (meta && meta.decision_trace) || [], handledBy: meta && meta.handled_by,
      hist: (doneEv && doneEv.history) || (meta && meta.history) || [],
      llm: (doneEv && doneEv.llm_calls) || (meta && meta.llm_calls) || [],
      anchor: (meta && meta.anchor) || {}, act: (meta && meta.dialog_act) || null,
      guard: doneEv ? doneEv.guard : null,
      secs: ((performance.now() - t0) / 1000).toFixed(1),
    };
    row._trace = trace;
    s.messages.push({ role: "assistant", content: acc, meta: metaEl ? metaEl.innerHTML : "", trace });
    selectRow(row);
  };
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = frame.split("\n").find(l => l.startsWith("data:"));
      if (!line) continue;
      const payload = line.slice(5).trim();
      if (payload === "[DONE]") continue;
      let ev; try { ev = JSON.parse(payload); } catch { continue; }
      gotAny = true;
      if (ev.type === "meta") {          // 意图/路由/槽位 先行到达
        meta = ev;
        ensureRow();
        metaEl.innerHTML = metaText(meta, null) + " · ⏳ 生成中…";
        renderTracePanel({ intent: ev.intent, route: ev.route_kind, slots: ev.slots,
                           missing: ev.missing_slots, dt: ev.decision_trace || [],
                           handledBy: ev.handled_by, hist: ev.history || [],
                           llm: ev.llm_calls || [], anchor: ev.anchor || {},
                           act: ev.dialog_act || null, pending: true });
      } else if (ev.type === "delta") {  // 答案逐块打出
        ensureRow();
        acc += ev.text;
        renderStream(bubble, acc);
      } else if (ev.type === "replace") {// 守卫整段替换
        ensureRow();
        acc = ev.text;
        renderStream(bubble, acc);
      } else if (ev.type === "done") {
        doneEv = ev;
      } else if (ev.type === "error") {
        throw new Error(ev.message);
      }
    }
  }
  if (!gotAny) return false;   // 端点异常无事件 → 回退JSON
  finalize();
  return true;
}

async function sendJson(s, text, tRow, t0) {
  const r = await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: curSid, query: text }),
  });
  const d = await r.json();
  tRow.remove();
  const meta = `<b>${d.intent.primary_intent_zh || d.intent.primary_intent}</b>` +
    ` · ${d.route_kind}` +
    (Object.keys(d.slots).length ? ` · 槽位:${Object.entries(d.slots).map(([k, v]) => k + "=" + v).join(" ")}` : "") +
    ` · ${Math.round(performance.now() - t0) / 1000}s`;
  const jrow = addBubble("assistant", d.reply, meta);
  const trace = {
    intent: d.intent, route: d.route_kind, slots: d.slots || {},
    missing: d.missing_slots || [], dt: d.decision_trace || [],
    hist: d.messages || [], llm: d.llm_calls || [], anchor: d.anchor || {},
    act: d.dialog_act || null,
    handledBy: d.intent && d.intent.handled_by, guard: d.guard,
    secs: ((performance.now() - t0) / 1000).toFixed(1),
  };
  jrow._trace = trace;
  s.messages.push({ role: "assistant", content: d.reply, meta, trace });
  selectRow(jrow);
  return true;
}

/* ---------- 输入框自动增高 ---------- */
function autosize() {
  const q = $("query");
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 140) + "px";
}
$("query").addEventListener("input", autosize);

$("send").onclick = send;
$("new-chat").onclick = newSession;
$("query").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

/* ---------- 初始化 ---------- */
(async function init() {
  bindChips();
  const ks = Object.keys(sessions);
  if (ks.length) switchSession(ks[0]); else await newSession();
})();
</script>
